<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Zombie Survival - Continue</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a1a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        canvas { display: block; background: #222; }
        
        #ui { 
            position: absolute; top: 20px; left: 20px; color: white; 
            font-size: 24px; pointer-events: none; text-shadow: 2px 2px 4px #000;
        }

        /* Tela de Game Over */
        #gameOverScreen {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none; /* Escondido por padrão */
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 10;
        }

        #gameOverScreen h1 { font-size: 60px; color: #ff4d4d; margin-bottom: 10px; }
        
        #btnRestart {
            padding: 15px 40px; font-size: 20px; cursor: pointer;
            background: #0095DD; color: white; border: none; border-radius: 5px;
            transition: background 0.3s;
        }

        #btnRestart:hover { background: #007bbd; }
    </style>
</head>
<body>

    <div id="ui">
        <div>Pontos: <span id="score">0</span></div>
        <div id="ammoDisplay">Munição: 10 / 10</div>
    </div>

    <div id="gameOverScreen">
        <h1>VOCÊ MORREU!</h1>
        <p id="finalScore">Pontuação: 0</p>
        <button id="btnRestart">Tentar Novamente</button>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreElement = document.getElementById('score');
const ammoElement = document.getElementById('ammoDisplay');
const gameOverScreen = document.getElementById('gameOverScreen');
const finalScoreElement = document.getElementById('finalScore');
const btnRestart = document.getElementById('btnRestart');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// Variáveis do Jogo
let score, gameOver, currentAmmo, isReloading, player, projectiles, enemies;
const maxAmmo = 10;
const reloadTime = 1500;
const keys = {};

// Inicializar ou Resetar o Jogo
function init() {
    score = 0;
    gameOver = false;
    currentAmmo = maxAmmo;
    isReloading = false;
    projectiles = [];
    enemies = [];
    
    player = {
        x: canvas.width / 2,
        y: canvas.height / 2,
        radius: 15,
        color: '#0095DD',
        speed: 5
    };

    scoreElement.innerHTML = score;
    ammoElement.innerHTML = `Munição: ${currentAmmo} / ${maxAmmo}`;
    gameOverScreen.style.display = 'none';
    
    animate();
}

// Controles
window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

window.addEventListener('click', (event) => {
    if(gameOver || isReloading) return;

    if (currentAmmo > 0) {
        const angle = Math.atan2(event.clientY - player.y, event.clientX - player.x);
        projectiles.push({
            x: player.x, y: player.y, radius: 5, color: 'yellow',
            velocity: { x: Math.cos(angle) * 8, y: Math.sin(angle) * 8 }
        });
        currentAmmo--;
        updateAmmoUI();
        if (currentAmmo === 0) startReload();
    }
});

function startReload() {
    isReloading = true;
    updateAmmoUI();
    setTimeout(() => {
        currentAmmo = maxAmmo;
        isReloading = false;
        updateAmmoUI();
    }, reloadTime);
}

function updateAmmoUI() {
    ammoElement.innerHTML = isReloading ? "RECARREGANDO..." : `Munição: ${currentAmmo} / ${maxAmmo}`;
}

// Criar Zumbis periodicamente
let spawnInterval = setInterval(() => {
    if(gameOver) return;
    let x, y;
    if (Math.random() < 0.5) {
        x = Math.random() < 0.5 ? -30 : canvas.width + 30;
        y = Math.random() * canvas.height;
    } else {
        x = Math.random() * canvas.width;
        y = Math.random() < 0.5 ? -30 : canvas.height + 30;
    }
    const angle = Math.atan2(player.y - y, player.x - x);
    enemies.push({
        x, y, radius: 20, color: '#ff4d4d',
        velocity: { x: Math.cos(angle) * 2, y: Math.sin(angle) * 2 }
    });
}, 1000);

function animate() {
    if(gameOver) return; // Para a animação
    
    requestAnimationFrame(animate);
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Movimento do Jogador
    if (keys['w'] && player.y > 0) player.y -= player.speed;
    if (keys['s'] && player.y < canvas.height) player.y += player.speed;
    if (keys['a'] && player.x > 0) player.x -= player.speed;
    if (keys['d'] && player.x < canvas.width) player.x += player.speed;

    // Desenhar Jogador
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
    ctx.fillStyle = player.color;
    ctx.fill();

    // Projéteis
    projectiles.forEach((p, i) => {
        p.x += p.velocity.x;
        p.y += p.velocity.y;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
        if (p.x < 0 || p.x > canvas.width || p.y < 0 || p.y > canvas.height) projectiles.splice(i, 1);
    });

    // Inimigos
    enemies.forEach((enemy, index) => {
        const angle = Math.atan2(player.y - enemy.y, player.x - enemy.x);
        enemy.x += Math.cos(angle) * 2;
        enemy.y += Math.sin(angle) * 2;

        ctx.beginPath();
        ctx.arc(enemy.x, enemy.y, enemy.radius, 0, Math.PI * 2);
        ctx.fillStyle = enemy.color;
        ctx.fill();

        // Colisão com Jogador (Perder)
        if (Math.hypot(player.x - enemy.x, player.y - enemy.y) < player.radius + enemy.radius) {
            endGame();
        }

        // Colisão com Projétil (Morte do Zumbi)
        projectiles.forEach((p, pIndex) => {
            if (Math.hypot(p.x - enemy.x, p.y - enemy.y) < p.radius + enemy.radius) {
                enemies.splice(index, 1);
                projectiles.splice(pIndex, 1);
                score += 10;
                scoreElement.innerHTML = score;
            }
        });
    });
}

function endGame() {
    gameOver = true;
    finalScoreElement.innerHTML = `Pontuação Final: ${score}`;
    gameOverScreen.style.display = 'flex';
}

// Botão Tentar Novamente
btnRestart.addEventListener('click', () => {
    init();
});

// Início inicial
init();
</script>
</body>
</html>
